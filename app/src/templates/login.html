<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>Sign in | WiseWatts EMS Administration</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', path='/css/app.css') }}"
    >
</head>

<body class="login-body">
    <main class="login-shell">
        <section
            class="login-card"
            aria-labelledby="login-heading"
        >
            <div class="login-brand">
                <div class="sidebar-brand-mark">
                    WW
                </div>

                <div>
                    <p class="eyebrow">WISEWATTS EMS</p>
                    <h1 id="login-heading">Administration Portal</h1>
                </div>
            </div>

            <p class="login-description">
                Sign in with your authorized portal account.
            </p>

            {% if error %}
            <div
                class="login-error"
                role="alert"
            >
                {{ error }}
            </div>
            {% endif %}

            <form
                method="post"
                action="/login"
                class="login-form"
                autocomplete="on"
            >
                <input
                    type="hidden"
                    name="next_path"
                    value="{{ next_path }}"
                >

                <label for="username">
                    Username
                </label>

                <input
                    id="username"
                    name="username"
                    type="text"
                    value="{{ username }}"
                    autocomplete="username"
                    autocapitalize="none"
                    spellcheck="false"
                    maxlength="128"
                    required
                    autofocus
                >

                <label for="password">
                    Password
                </label>

                <input
                    id="password"
                    name="password"
                    type="password"
                    autocomplete="current-password"
                    maxlength="512"
                    required
                >

                <button type="submit">
                    Sign in
                </button>
            </form>

            <p class="login-environment">
                Environment: {{ environment }}
            </p>
        </section>
    </main>
</body>
</html>
