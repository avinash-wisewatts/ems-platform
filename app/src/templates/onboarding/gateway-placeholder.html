{% extends "onboarding/layout.html" %}

{% block onboarding_content %}
<section class="form-card">
    <div class="section-heading">
        <span class="step-number">4</span>

        <div>
            <h3>Location saved</h3>
            <p>
                Organization, Site, and Physical Location are now stored in
                the onboarding draft.
            </p>
        </div>
    </div>

    <div class="alert success-card">
        <strong>Physical Location saved successfully.</strong>
        Gateway configuration is the next onboarding module.
    </div>

    <div class="wizard-step-actions">
        <a
            class="button-link secondary"
            href="/onboarding/location?draft={{ draft_token }}"
        >
            Back to location
        </a>

        <button type="button" disabled>
            Gateway module next
        </button>
    </div>
</section>
{% endblock %}
