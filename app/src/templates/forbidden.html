<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>Access denied | WiseWatts EMS Administration</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', path='/css/app.css') }}"
    >
</head>

<body class="login-body">
    <main class="login-shell">
        <section
            class="login-card"
            aria-labelledby="forbidden-heading"
        >
            <div class="login-brand">
                <div class="sidebar-brand-mark">
                    WW
                </div>

                <div>
                    <p class="eyebrow">WISEWATTS EMS</p>
                    <h1 id="forbidden-heading">
                        Access denied
                    </h1>
                </div>
            </div>

            <p class="login-description">
                Your account does not have permission to perform this action.
            </p>

            <p>
                Signed in as
                <strong>{{ username }}</strong>
                with role
                <strong>{{ role_code }}</strong>.
            </p>

            <div class="form-actions">
                <a
                    class="button-link"
                    href="/onboarding/organization"
                >
                    Return to portal
                </a>

                <form
                    method="post"
                    action="/logout"
                >
                    <button
                        type="submit"
                        class="button-link secondary"
                    >
                        Sign out
                    </button>
                </form>
            </div>

            <p class="login-environment">
                Environment: {{ environment }}
            </p>
        </section>
    </main>
</body>
</html>
