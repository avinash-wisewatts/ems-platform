# ============================================================================
# Edge certificate check (staging customer endpoint, ADR-023)
#
# Read-only alert before the public certificate expires. Every 30 minutes a
# GitHub-hosted runner makes one TLS handshake to the staging customer
# endpoint (scripts/verify/check_edge_certificate.sh) and fails when the
# chain does not verify or fewer than 48 h (repository variable
# EDGE_CERT_MIN_HOURS) of validity remain -- i.e. when
# Caddy's automatic renewal has already failed (the 6-day Let's Encrypt IP
# certificate is normally renewed about 3 days before expiry).
#
# It also fails if the endpoint stops answering on 443 from the internet,
# which would also stop ACME validation.
#
# Alert: a failed check opens (or comments on) one GitHub issue labelled
# edge-certificate-alert, assigned to and @mentioning the recipient
# (repository variable EDGE_CERT_ALERT_RECIPIENT, default avinash-wisewatts);
# scripts/verify/edge_certificate_alert.sh. GitHub's own "run failed" e-mail
# is not relied on: it depends on the personal notification settings of
# whoever last changed the schedule or dispatched the run, and leaves no
# record (a deliberate failing run on 2026-10-28 produced none). Every
# failing run updates the open issue; a reminder @mention follows at most
# every 6 h. A passing check closes it only when its threshold is at least
# the configured one, so a manual run with a lowered min_hours cannot.
#
# Cadence: GitHub runs schedules best-effort and drops runs under load --
# 2026-10-28/29 only 2 of 6 slots of the former 3-hourly "23 */3" schedule
# ran (no run, cancelled or failed, exists for the other 4). Two off-peak
# slots an hour make each dropped slot cheap. Each run also reports the gap
# since the previous run (warning when over 2 h); that is visibility after
# the fact, not a dead-man's switch -- it runs on the same scheduler.
#
# Nothing here touches the host, Caddy or the certificate; no secrets
# (only the workflow's own token: issues write, actions read).
# Staging only. Scheduled workflows run from the default branch (staging)
# and GitHub disables them after 60 days without repository activity.
# ============================================================================

name: Edge certificate check

on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:
    inputs:
      min_hours:
        description: "Fail when fewer than this many hours of validity remain (empty = configured threshold, 48 h unless EDGE_CERT_MIN_HOURS is set)"
        required: false
        default: ""

permissions:
  contents: read
  issues: write
  actions: read

concurrency:
  group: edge-certificate-check
  cancel-in-progress: false

jobs:
  staging-customer-endpoint:
    name: Staging customer endpoint certificate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # The staging customer host (root .env EMS_CUSTOMER_HOST). A repository
      # variable overrides it once a hostname replaces the interim IP.
      EDGE_HOST: ${{ vars.STAGING_CUSTOMER_EDGE_HOST || '16.113.18.69' }}
      # The configured threshold; a manual run may override it for this run.
      CONFIGURED_MIN_HOURS: ${{ vars.EDGE_CERT_MIN_HOURS || '48' }}
      MIN_HOURS: ${{ inputs.min_hours || vars.EDGE_CERT_MIN_HOURS || '48' }}
      ALERT_RECIPIENT: ${{ vars.EDGE_CERT_ALERT_RECIPIENT || 'avinash-wisewatts' }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4

      - name: Check certificate validity and renewal
        shell: bash
        run: |
          set -o pipefail
          ./scripts/verify/check_edge_certificate.sh "${EDGE_HOST}" 443 "${MIN_HOURS}" | tee "${RUNNER_TEMP}/edge-certificate-check.log"

      - name: Report schedule gap since the previous run
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: ./scripts/verify/edge_certificate_schedule_gap.sh edge-certificate-check.yml "${{ github.run_id }}" 2

      - name: Raise alert issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: ./scripts/verify/edge_certificate_alert.sh raise "${EDGE_HOST}" "${RUN_URL}" "${ALERT_RECIPIENT}" "${RUNNER_TEMP}/edge-certificate-check.log"

      # Closes the alert only when this run's threshold is at least the
      # configured one (checked in the script), so a manual run with a lowered
      # min_hours cannot close a real alert.
      - name: Resolve alert issue
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: ./scripts/verify/edge_certificate_alert.sh resolve "${EDGE_HOST}" "${RUN_URL}" "${MIN_HOURS}" "${CONFIGURED_MIN_HOURS}"
