name: CI

# Reusable verification pipeline.
#
# Called directly on every pull request and every push (fast feedback), and
# also invoked via `workflow_call` from deploy-staging.yml so the exact same
# gates must pass before anything is built/pushed/deployed. No job here ever
# touches a remote host, HiveMQ, or production.
#
# Live MQTT smoke tests are intentionally NOT run here: they publish real
# messages and are opt-in only (RUN_LIVE_MQTT_SMOKE=true), reserved for a
# manually authorized run against a real broker/credential set.

on:
  pull_request:
  push:
    branches: ["**"]
  workflow_call:
    outputs:
      passed:
        description: "Whether all CI gates passed"
        value: ${{ jobs.summary.outputs.passed }}

permissions:
  contents: read

jobs:
  config-validation:
    name: Configuration validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create CI-only placeholder env files
        # compose.yaml's env_file: entries must exist as real files or
        # `docker compose config` fails outright ("env file ... not found")
        # -- this is a hard error, independent of and prior to any variable
        # interpolation. The real .env files are intentionally untracked
        # (see .gitignore) and never exist on a fresh runner.
        #
        # These placeholders are written only into the ephemeral runner
        # workspace, are never committed, and contain no real credentials --
        # just non-secret values for the two variables compose.yaml actually
        # interpolates (POSTGRES_USER, POSTGRES_DB, used only in the
        # timescaledb healthcheck string). The other five files are left
        # empty: compose.yaml itself never interpolates values from them --
        # they are only consumed by application containers at runtime,
        # which this validation step does not start.
        run: |
          cat > .env <<'EOF'
          POSTGRES_USER=ci_placeholder_user
          POSTGRES_DB=ci_placeholder_db
          EOF
          touch app/.env
          touch app/live-telemetry.env
          touch telegraf/.env
          touch grafana/.env
          touch grafana/live-stream.env

      - name: Validate compose configuration (staging/production shape)
        run: docker compose -f compose.yaml config -q

      - name: Validate compose configuration (disposable test database)
        run: docker compose -f compose.test.yaml config -q

  docker-build-validate:
    name: Docker build validation (application image)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build application image (validation only -- not pushed)
        run: |
          docker build \
            --file app/Dockerfile \
            --tag ems-app:ci-build-validate \
            ./app

  app-tests:
    name: Application test suite (pytest)
    runs-on: ubuntu-latest
    needs: [docker-build-validate]
    steps:
      - uses: actions/checkout@v4

      - name: Build application test image
        run: |
          docker build \
            --file app/Dockerfile.test \
            --tag ems-admin-portal-test \
            .

      - name: Start disposable test database
        run: ./scripts/test/test_database.sh start

      - name: Deploy canonical database
        run: ./scripts/test/deploy_test_database.sh

      - name: Apply test migrations
        run: ./scripts/test/apply_test_migrations.sh

      - name: Run application test suite
        run: docker run --rm --network host ems-admin-portal-test

      - name: Tear down disposable test database
        if: always()
        run: ./scripts/test/test_database.sh destroy

  database-integration-tests:
    name: Database / migration / repository integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run disposable-database canonical + migration integration suite
        run: ./scripts/test/run_integration_environment.sh

      - name: Tear down disposable test database
        if: always()
        run: ./scripts/test/test_database.sh destroy

  web-frontend:
    # Phase 8 frontend foundation. Independent of the Python application: this
    # job never touches the database, a remote host, or Grafana. It type-checks,
    # lints, unit-tests and production-builds the web/ shell. The Playwright
    # auth/permission E2E is deliberately NOT run here -- it needs a deployed
    # staging shell and a real portal session (see web/e2e/auth.spec.ts).
    name: Web frontend (typecheck / lint / test / build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies (exact lockfile)
        run: npm ci --no-audit --no-fund

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit / component tests
        run: npm run test

      - name: Production build
        run: npm run build

      - name: Dependency audit (report only -- does not fail the build)
        run: npm audit --omit=dev || true

  summary:
    name: CI summary
    runs-on: ubuntu-latest
    needs:
      - config-validation
      - docker-build-validate
      - app-tests
      - database-integration-tests
      - web-frontend
    outputs:
      passed: ${{ steps.result.outputs.passed }}
    steps:
      - id: result
        run: echo "passed=true" >> "$GITHUB_OUTPUT"
