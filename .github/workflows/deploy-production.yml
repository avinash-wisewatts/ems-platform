name: Deploy to Production

# Production deployment ARCHITECTURE.
#
# This workflow is created as part of the CI/CD implementation task but is
# NEVER automatically triggered. It only runs when a human explicitly
# invokes it (workflow_dispatch).
#
# GitHub Free does not offer the "Required reviewers" Environment protection
# rule, so the `environment: production` block below provides secret scoping
# ONLY -- it does not pause the run for approval. All promotion controls are
# therefore enforced in-workflow, entirely inside the `validate-promotion`
# job, which must fully succeed before the `deploy-production` job (the only
# job with SSH access to production) is even allowed to start:
#
#   1. release_git_sha must be a full 40-character commit SHA, and
#      confirm_release_git_sha must match it byte-for-byte (deliberate
#      double-entry -- the operator must consciously look up and retype the
#      exact commit, not just click a button).
#   2. The requesting GitHub actor must appear in the
#      PRODUCTION_APPROVED_OPERATORS environment variable (a repo-native
#      allowlist -- see docs/operations/CICD_PIPELINE.md). Repository write
#      access alone is NOT sufficient.
#   3. release_git_sha must be staging's CURRENT HEAD, re-verified again
#      immediately before deployment to close the push-after-validation
#      race window. This workflow only ever promotes "staging, right now" --
#      never an arbitrary older or newer SHA (that is rollback.yml's job).
#   4. release_git_sha must correspond to a deploy-staging.yml run whose
#      headSha matches and whose conclusion is "success" -- proof staging
#      was actually deployed AND passed its own post-deployment
#      verification, not merely that CI ran once.
#   5. The image ghcr.io/<repo>-app:<release_git_sha> -- derived from the
#      SHA, never accepted as independent input -- must actually exist in
#      GHCR. validate-promotion verifies this early (fail-fast, and shown in
#      the promotion summary); deploy-production independently re-resolves
#      and pins the immutable digest itself, immediately before the SSH
#      step, rather than consuming validate-promotion's resolved value
#      through a job output. That split exists because a job-level output
#      (jobs.<id>.outputs, the mechanism behind needs.*.outputs.*) is
#      scanned against every secret used in that job when it completes, and
#      GitHub Actions silently drops any output value that happens to
#      match -- exactly what happened to the digest-pinned image string on
#      this workflow's first real dispatch (2026-08-25, run 32858328343 ->
#      32861162765): validate-promotion reported success, but
#      deploy-production's APP_IMAGE was silently empty, and
#      deploy_release.sh correctly refused to run with no image. Resolving
#      the digest again inside deploy-production as a same-job step output
#      avoids that cross-job channel entirely without weakening any
#      guarantee: the image is still derived only from release_git_sha,
#      still authenticated against GHCR, and still pinned to its immutable
#      digest before deploy_release.sh ever runs.
#
# It never rebuilds from source, and it never accepts an arbitrary branch,
# ref, or independently-supplied image tag as its artifact source.
#
# Secrets referenced here (PRODUCTION_HOST, PRODUCTION_USER,
# PRODUCTION_SSH_KEY, PRODUCTION_PROJECT_PATH, REGISTRY_USERNAME,
# REGISTRY_PASSWORD) must be configured before this workflow can ever run.
# See docs/operations/CICD_PIPELINE.md for the exact list, plus the
# PRODUCTION_APPROVED_OPERATORS environment variable (Settings ->
# Environments -> production -> Variables), which must be populated with a
# comma-separated list of authorized GitHub usernames before any promotion
# can succeed -- this gate fails closed if that variable is unset or empty.

on:
  workflow_dispatch:
    inputs:
      release_git_sha:
        description: "Exact 40-character commit SHA to promote (must be staging's current HEAD)"
        required: true
      confirm_release_git_sha:
        description: "Retype the same commit SHA to confirm -- must match release_git_sha exactly"
        required: true

permissions:
  contents: read
  actions: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}-app

jobs:
  validate-promotion:
    name: Validate promotion candidate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Require an approved production operator
        env:
          ACTOR: ${{ github.actor }}
          APPROVED_OPERATORS: ${{ vars.PRODUCTION_APPROVED_OPERATORS }}
        run: |
          if [[ -z "${APPROVED_OPERATORS}" ]]; then
            echo "::error::PRODUCTION_APPROVED_OPERATORS environment variable is unset or empty. Configure it under Settings -> Environments -> production -> Variables before any production promotion can run."
            exit 1
          fi
          IFS=',' read -ra allowed <<< "${APPROVED_OPERATORS}"
          authorized="false"
          for name in "${allowed[@]}"; do
            trimmed="$(echo "${name}" | xargs)"
            if [[ "${trimmed}" == "${ACTOR}" ]]; then
              authorized="true"
              break
            fi
          done
          if [[ "${authorized}" != "true" ]]; then
            echo "::error::GitHub actor '${ACTOR}' is not in PRODUCTION_APPROVED_OPERATORS. Repository write access alone does not authorize a production deployment."
            exit 1
          fi
          echo "Authorized production operator: ${ACTOR}"

      - name: Require exact double-entry commit-SHA confirmation
        env:
          RELEASE_SHA: ${{ inputs.release_git_sha }}
          CONFIRM_SHA: ${{ inputs.confirm_release_git_sha }}
        run: |
          if [[ ! "${RELEASE_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::release_git_sha must be exactly 40 lowercase hexadecimal characters, got: ${RELEASE_SHA}"
            exit 1
          fi
          if [[ "${RELEASE_SHA}" != "${CONFIRM_SHA}" ]]; then
            echo "::error::confirm_release_git_sha does not match release_git_sha byte-for-byte"
            exit 1
          fi
          echo "Confirmation matches: ${RELEASE_SHA}"

      - name: Require release_git_sha to be staging's current HEAD
        id: staging-head
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ inputs.release_git_sha }}
        run: |
          # This repository is private, and this job never runs
          # actions/checkout, so there is no git credential helper
          # configured for an unauthenticated `git ls-remote` over HTTPS to
          # succeed. The authoritative source for refs/heads/staging is
          # queried instead through the authenticated GitHub API (contents:
          # read, already granted above), which returns the exact same ref
          # object git itself would resolve -- not a derived or cached
          # value.
          head="$(gh api "repos/${{ github.repository }}/git/ref/heads/staging" --jq '.object.sha')"
          if [[ -z "${head}" ]]; then
            echo "::error::Could not resolve origin/staging HEAD via the GitHub API"
            exit 1
          fi
          if [[ "${RELEASE_SHA}" != "${head}" ]]; then
            echo "::error::release_git_sha (${RELEASE_SHA}) is not staging's current HEAD (${head}). This workflow only promotes the current staging tip -- use rollback.yml for an older, previously-deployed commit."
            exit 1
          fi
          echo "staging_head=${head}" >> "$GITHUB_OUTPUT"
          echo "release_git_sha matches staging HEAD: ${head}"

      - name: Require a successful deploy-staging.yml run for this exact SHA
        id: staging-run
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ inputs.release_git_sha }}
        run: |
          run_json="$(gh run list --repo "${{ github.repository }}" --workflow=deploy-staging.yml \
            --json headSha,conclusion,url,databaseId --limit 100 \
            --jq "[.[] | select(.headSha==\"${RELEASE_SHA}\" and .conclusion==\"success\")] | first")"
          if [[ -z "${run_json}" || "${run_json}" == "null" ]]; then
            echo "::error::No successful deploy-staging.yml run found with headSha=${RELEASE_SHA}. The commit must be built, deployed, and post-deployment-verified on staging before it can be promoted."
            exit 1
          fi
          run_url="$(echo "${run_json}" | jq -r '.url')"
          run_id="$(echo "${run_json}" | jq -r '.databaseId')"
          echo "run_url=${run_url}" >> "$GITHUB_OUTPUT"
          echo "run_id=${run_id}" >> "$GITHUB_OUTPUT"
          echo "Verified by staging deployment run: ${run_url}"

      - name: Verify the SHA-derived image exists in GHCR
        # Early, fail-fast existence check for operator feedback and the
        # promotion summary below. This step's resolved digest is
        # deliberately NOT exposed as a job-level output for
        # deploy-production to consume -- see that job's own "Resolve and
        # pin the deployment image" step for why: a job-level output
        # (jobs.<id>.outputs, the mechanism behind needs.*.outputs.*) is
        # scanned against every secret used in this job when the job
        # completes, and GitHub Actions silently drops (not fails, just
        # drops with a warning) any output value that happens to match.
        # That is exactly what happened on the first real dispatch of this
        # workflow (2026-08-25, run 32858328343 -> 32861162765): the
        # digest-pinned image string was computed correctly, printed
        # correctly in this job's own summary, and then silently discarded
        # at job-completion ("Skip output 'image_with_digest' since it may
        # contain secret"), leaving deploy-production's APP_IMAGE empty
        # even though validate-promotion itself reported success.
        id: resolve-image
        env:
          RELEASE_SHA: ${{ inputs.release_git_sha }}
        run: |
          image="${REGISTRY}/${IMAGE_NAME}:${RELEASE_SHA}"
          echo "${{ secrets.REGISTRY_PASSWORD }}" | docker login "${REGISTRY}" \
            --username "${{ secrets.REGISTRY_USERNAME }}" \
            --password-stdin

          inspect_output="$(docker buildx imagetools inspect "${image}" 2>&1)" || {
            echo "::error::Image not found in registry: ${image}"
            echo "${inspect_output}"
            exit 1
          }
          digest="$(echo "${inspect_output}" | awk '/^Digest:/{print $2; exit}')"
          if [[ -z "${digest}" ]]; then
            echo "::error::Could not resolve a digest for ${image}"
            exit 1
          fi

          image_with_digest="${REGISTRY}/${IMAGE_NAME}:${RELEASE_SHA}@${digest}"
          echo "image_with_digest=${image_with_digest}" >> "$GITHUB_OUTPUT"
          echo "Resolved image: ${image_with_digest}"

      - name: Promotion summary
        env:
          RELEASE_SHA: ${{ inputs.release_git_sha }}
          STAGING_HEAD: ${{ steps.staging-head.outputs.staging_head }}
          STAGING_RUN_URL: ${{ steps.staging-run.outputs.run_url }}
          STAGING_RUN_ID: ${{ steps.staging-run.outputs.run_id }}
          IMAGE_WITH_DIGEST: ${{ steps.resolve-image.outputs.image_with_digest }}
          ACTOR: ${{ github.actor }}
        run: |
          {
            echo "### Production promotion candidate"
            echo
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| release_git_sha | \`${RELEASE_SHA}\` |"
            echo "| confirmation match | yes |"
            echo "| current staging HEAD | \`${STAGING_HEAD}\` |"
            echo "| staging deployment run | [${STAGING_RUN_ID}](${STAGING_RUN_URL}) |"
            echo "| derived image (digest-pinned) | \`${IMAGE_WITH_DIGEST}\` |"
            echo "| authorized actor | \`${ACTOR}\` |"
          } | tee -a "$GITHUB_STEP_SUMMARY"

  deploy-production:
    name: Deploy exact staging-proven artifact to production
    needs: validate-promotion
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Re-verify staging HEAD has not moved since validation
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ inputs.release_git_sha }}
        run: |
          # See the equivalent step in validate-promotion for why this uses
          # the authenticated GitHub API rather than an unauthenticated
          # `git ls-remote` (this repository is private and this job never
          # runs actions/checkout). This job never receives the production
          # SSH secrets (PRODUCTION_HOST/USER/SSH_KEY) until the next step,
          # so this re-check still runs entirely before any production
          # access is possible.
          head="$(gh api "repos/${{ github.repository }}/git/ref/heads/staging" --jq '.object.sha')"
          if [[ -z "${head}" ]]; then
            echo "::error::Could not resolve origin/staging HEAD via the GitHub API"
            exit 1
          fi
          if [[ "${RELEASE_SHA}" != "${head}" ]]; then
            echo "::error::staging HEAD moved to ${head} after this promotion was validated for ${RELEASE_SHA}. Aborting -- re-run this workflow against the new staging HEAD."
            exit 1
          fi
          echo "staging HEAD still matches validated release_git_sha: ${head}"

      - name: Resolve and pin the deployment image
        # Authoritative for this deployment. Deliberately re-resolved here,
        # in this job, as a same-job step output (steps.*.outputs.*, never
        # a jobs.*.outputs.* cross-job output) -- not consumed from
        # validate-promotion's equivalent step, because a job-level output
        # is exactly what GitHub Actions silently discarded on the first
        # real dispatch (see validate-promotion's "Verify the SHA-derived
        # image exists in GHCR" step for the full explanation). A same-job
        # step output never leaves this job's boundary, so it is not
        # subject to that job-outputs secret-masking check. The image is
        # still derived only from release_git_sha (never an
        # independently-supplied tag), still authenticated against GHCR
        # with the same registry credentials, and still pinned to its
        # immutable digest before deploy_release.sh ever runs.
        id: resolve-image
        env:
          RELEASE_SHA: ${{ inputs.release_git_sha }}
        run: |
          image="${REGISTRY}/${IMAGE_NAME}:${RELEASE_SHA}"
          echo "${{ secrets.REGISTRY_PASSWORD }}" | docker login "${REGISTRY}" \
            --username "${{ secrets.REGISTRY_USERNAME }}" \
            --password-stdin

          inspect_output="$(docker buildx imagetools inspect "${image}" 2>&1)" || {
            echo "::error::Image not found in registry: ${image}"
            echo "${inspect_output}"
            exit 1
          }
          digest="$(echo "${inspect_output}" | awk '/^Digest:/{print $2; exit}')"
          if [[ -z "${digest}" ]]; then
            echo "::error::Could not resolve a digest for ${image}"
            exit 1
          fi

          image_with_digest="${REGISTRY}/${IMAGE_NAME}:${RELEASE_SHA}@${digest}"
          echo "image_with_digest=${image_with_digest}" >> "$GITHUB_OUTPUT"
          echo "Resolved image: ${image_with_digest}"

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          envs: RELEASE_SHA,APP_IMAGE,REGISTRY_USERNAME,REGISTRY_PASSWORD
          script: |
            set -euo pipefail
            export PROJECT_PATH="${{ secrets.PRODUCTION_PROJECT_PATH }}"
            export APP_IMAGE="${APP_IMAGE}"
            export RELEASE_GIT_SHA="${RELEASE_SHA}"
            export ENVIRONMENT_NAME="production"
            "${PROJECT_PATH}/scripts/release/deploy_release.sh"
        env:
          RELEASE_SHA: ${{ inputs.release_git_sha }}
          APP_IMAGE: ${{ steps.resolve-image.outputs.image_with_digest }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}

  verify-production:
    name: Post-deployment verification
    needs: deploy-production
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Run post-deployment verification gate on production
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          script: |
            set -euo pipefail
            cd "${{ secrets.PRODUCTION_PROJECT_PATH }}"
            ./scripts/release/post_deploy_verify.sh
