name: ems-platform-prod

services:

  timescaledb:
    image: timescale/timescaledb:latest-pg16

    container_name: ems-timescaledb

    restart: unless-stopped

    env_file:
      - .env

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - ./postgres/data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 20s
      timeout: 5s
      retries: 5

    shm_size: 512m


  telegraf:
    image: telegraf:1.36

    container_name: ems-telegraf

    restart: unless-stopped

    env_file:
      - .env
      - ./telegraf/.env

    volumes:
      - ./telegraf/config/telegraf.conf:/etc/telegraf/telegraf.conf:ro
      - ./telegraf/logs:/var/log/telegraf


  grafana:
    # Pinned for deterministic deployments. Upgrade only through a tested
    # repository change rather than silently following the latest tag.
    image: grafana/grafana-oss:11.6.0

    container_name: ems-grafana

    restart: unless-stopped

    env_file:
      - ./grafana/.env

    depends_on:
      timescaledb:
        condition: service_healthy

    # Grafana is not publicly exposed yet.
    #
    # Access it from the EC2 host or through an SSH tunnel. Caddy and public TLS
    # exposure will be configured only after authentication and tenant isolation
    # have been validated.
    ports:
      - "127.0.0.1:3000:3000"

    volumes:
      # Persistent Grafana application database and state.
      - ./grafana/data:/var/lib/grafana

      # Declarative provisioning managed in Git.
      - ./grafana/provisioning:/etc/grafana/provisioning:ro

      # Dashboard JSON managed in Git.
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro

      # Writable plugin directory.
      - ./grafana/plugins:/var/lib/grafana/plugins

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O - http://localhost:3000/api/health | grep -Eq '\"database\"[[:space:]]*:[[:space:]]*\"ok\"'"
        ]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 30s

  admin-portal:
    # WiseWatts EMS metadata and tenant onboarding interface.
    build:
      context: ./app
      dockerfile: Dockerfile

    container_name: ems-admin-portal

    restart: unless-stopped

    env_file:
      - ./app/.env

    depends_on:
      timescaledb:
        condition: service_healthy

      grafana:
        condition: service_healthy

    # Keep the administration portal private during development.
    # Access it from the EC2 host or through an SSH tunnel.
    ports:
      - "127.0.0.1:8080:8080"

    volumes:
      - ./grafana/dashboards:/app/grafana-dashboards:ro

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import json,urllib.request; data=json.load(urllib.request.urlopen('http://localhost:8080/health', timeout=3)); raise SystemExit(0 if data.get('status') == 'ok' and data.get('database', {}).get('status') == 'ok' else 1)"
        ]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 30s
