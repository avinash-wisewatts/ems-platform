name: ems-platform-prod

services:

  timescaledb:
    # Pinned by digest to the exact image verified healthy on staging
    # (PostgreSQL 16.15 / TimescaleDB extension 2.29.2, confirmed via
    # `docker inspect` and scripts/verify/verify_database.sh at pin time).
    # This replaces the previously floating `latest-pg16` tag. Upgrading
    # requires a deliberate repository change and re-verification, not an
    # incidental re-pull.
    image: timescale/timescaledb@sha256:289d55704b1b3ee8263cd3805c6930f9cd54506835a8f19f9b85dad17d5c5a8a

    container_name: ems-timescaledb

    restart: unless-stopped

    # PostgreSQL runtime configuration, managed declaratively here rather than
    # by editing postgresql.conf inside the persisted PGDATA volume.
    #
    # `postgres -c <name>=<value>` command-line settings have the HIGHEST
    # precedence in PostgreSQL -- they override both postgresql.conf and
    # postgresql.auto.conf -- so the effective value is deterministic
    # regardless of whatever the initdb-time postgresql.conf still contains.
    # PGDATA and its postgresql.conf are never read/written by this change.
    #
    # max_connections is a `postmaster` setting: it only takes effect when the
    # timescaledb container is (re)created. scripts/release/deploy_release.sh
    # deliberately never recreates timescaledb, so after this file lands on a
    # host a ONE-TIME, deliberate recreate is required to apply it:
    #
    #     docker compose -f compose.yaml up -d --no-deps timescaledb
    #
    # (clean restart; the PGDATA bind volume is reattached unchanged). This is
    # the same deliberate-infra-recreate model already used for Grafana plugin
    # / version changes. scripts/verify/verify_database.sh asserts the
    # effective max_connections after the restart.
    #
    # Root cause is insufficient connection-slot headroom (slot exhaustion),
    # NOT a Grafana query / dashboard SQL / datasource defect. Observed on
    # staging via pg_stat_activity: max_connections=25,
    # superuser_reserved_connections=3 -> 22 slots for normal roles; concurrent
    # holders grafana_reader=10, ems_app=7, telegraf=1; total pg_stat_activity
    # entries reached 31. Normal-role demand exceeded the 22-slot ceiling, so
    # new sessions failed with "remaining connection slots are reserved for
    # roles with the SUPERUSER attribute". 50 total - 3 reserved = 47 usable
    # restores headroom above the observed peak.
    command:
      - postgres
      - -c
      - max_connections=50
      - -c
      - superuser_reserved_connections=3

    env_file:
      - .env

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - ${TIMESCALEDB_DATA_PATH:-./postgres/data/pgdata}:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 20s
      timeout: 5s
      retries: 5

    shm_size: 512m


  telegraf:
    image: telegraf:1.36

    container_name: ems-telegraf

    restart: unless-stopped

    env_file:
      - .env
      - ./telegraf/.env

    volumes:
      - ./telegraf/config/telegraf.conf:/etc/telegraf/telegraf.conf:ro
      - ./telegraf/logs:/var/log/telegraf


  grafana:
    # Pinned for deterministic deployments. Upgrade only through a tested
    # repository change rather than silently following the latest tag.
    image: grafana/grafana-oss:11.6.0

    container_name: ems-grafana

    restart: unless-stopped

    env_file:
      - ./grafana/.env
      - ./grafana/live-stream.env

    environment:
      GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS: wisewatts-live-datasource
      EMS_LIVE_TELEMETRY_WS_BASE_URL: ws://live-telemetry:8090

    depends_on:
      timescaledb:
        condition: service_healthy

    # Grafana is not publicly exposed yet.
    #
    # Access it from the EC2 host or through an SSH tunnel. Caddy and public TLS
    # exposure will be configured only after authentication and tenant isolation
    # have been validated.
    ports:
      - "${GRAFANA_BIND_HOST:-127.0.0.1}:3000:3000"

    volumes:
      # Persistent Grafana application database and state.
      - ./grafana/data:/var/lib/grafana

      # Declarative provisioning managed in Git.
      - ./grafana/provisioning:/etc/grafana/provisioning:ro

      # Dashboard JSON managed in Git.
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro

      # Writable plugin directory.
      - ./grafana/plugins:/var/lib/grafana/plugins

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O - http://localhost:3000/api/health | grep -Eq '\"database\"[[:space:]]*:[[:space:]]*\"ok\"'"
        ]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 30s

  live-telemetry:
    # Dedicated server-side real-time path. Grafana/browser never receives
    # MQTT credentials or vendor topic knowledge.
    #
    # Built once in CI and tagged with the immutable Git commit SHA; deploy
    # workflows set APP_IMAGE to that exact tag so staging/production run
    # the identical artifact. `build:` is retained only so local
    # `docker compose build` still works for development; deployment scripts
    # never pass --build.
    image: ${APP_IMAGE:-ems-platform-prod-app:local}
    build:
      context: ./app
      dockerfile: Dockerfile

    container_name: ems-live-telemetry
    restart: unless-stopped

    env_file:
      - ./app/.env
      - ./app/live-telemetry.env

    depends_on:
      timescaledb:
        condition: service_healthy

    command: ["uvicorn", "src.live_main:app", "--host", "0.0.0.0", "--port", "8090"]

    ports:
      - "127.0.0.1:8090:8090"

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import json,urllib.request; data=json.load(urllib.request.urlopen('http://localhost:8090/health', timeout=3)); raise SystemExit(0 if data.get('status') == 'ok' else 1)"
        ]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 20s


  admin-portal:
    # WiseWatts EMS metadata and tenant onboarding interface.
    #
    # Shares the exact same built artifact as live-telemetry (same
    # Dockerfile/context, different `command:` below) -- one image, tagged
    # with the immutable Git commit SHA in CI, is used for both services and
    # promoted unchanged from staging to production.
    image: ${APP_IMAGE:-ems-platform-prod-app:local}
    build:
      context: ./app
      dockerfile: Dockerfile

    container_name: ems-admin-portal

    restart: unless-stopped

    env_file:
      - ./app/.env

    environment:
      # Dedicated EMS Web App container switch. Set EMS_WEB_UPSTREAM in the
      # host root .env (normally http://ems-web:80) to serve /app/* by
      # proxying -- after this service's own authentication/authorization --
      # to the `ems-web` service below. Unset/empty (the default, and the
      # state of any host that has not opted in, including production) keeps
      # the bind-mounted bundle hook (EMS_WEB_SPA_PATH volume below), which is
      # also the rollback fallback. Deliberately NOT a depends_on: recreating
      # admin-portal never touches ems-web, and vice versa.
      EMS_WEB_UPSTREAM: ${EMS_WEB_UPSTREAM:-}

    depends_on:
      timescaledb:
        condition: service_healthy

      grafana:
        condition: service_healthy

    # Keep the administration portal private during development.
    # Access it from the EC2 host or through an SSH tunnel.
    ports:
      - "${ADMIN_PORTAL_BIND_HOST:-127.0.0.1}:8080:8080"

    volumes:
      - ./grafana/dashboards:/app/grafana-dashboards:ro

      # Phase 8 frontend shell -- delivered as an INDEPENDENT, immutably
      # git-SHA-tagged artifact (ghcr.io/<owner>/<repo>-web:<sha>), NOT part
      # of this image.
      #
      # app/src is baked into the admin-portal image (app/Dockerfile:
      # `COPY src /app/src`) and is not otherwise a bind mount, so this is the
      # ONLY path by which the separately-built, separately-rolled-back React
      # bundle reaches the running container. app/src/main.py serves it
      # same-origin under /app (reusing the existing session cookie -- no
      # CORS, no second auth) only when `<mount>/index.html` exists.
      #
      # scripts/release/deploy_web_bundle.sh populates the host directory from
      # the -web image before the container is (re)created. When the directory
      # is absent compose creates it empty, the /app hook stays inert, and the
      # admin portal is unchanged -- this is the safe default on any host
      # (including production) that has not deployed the frontend. Read-only:
      # the application process never writes here.
      - ${EMS_WEB_SPA_PATH:-./web-spa}:/app/src/spa:ro

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import json,urllib.request; data=json.load(urllib.request.urlopen('http://localhost:8080/health', timeout=3)); raise SystemExit(0 if data.get('status') == 'ok' and data.get('database', {}).get('status') == 'ok' else 1)"
        ]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 30s


  ems-web:
    # EMS Customer Web App -- the static React bundle served by nginx from
    # its own container, so it is deployed, restarted and rolled back
    # independently of admin-portal (scripts/release/deploy_web.sh recreates
    # ONLY this service).
    #
    # Built once in CI from web/Dockerfile, tagged with the immutable Git
    # commit SHA (ghcr.io/<owner>/<repo>-web:<sha>) and deployed by digest;
    # deploy_web.sh sets EMS_WEB_IMAGE to that exact reference. `build:` is
    # retained only so local `docker compose build` works; deployment scripts
    # never pass --build. Never created by deploy_release.sh (which names
    # admin-portal/live-telemetry only), so a host that has not deployed it
    # -- production today -- is unaffected by its presence here.
    image: ${EMS_WEB_IMAGE:-ems-platform-prod-web:local}
    build:
      context: ./web
      dockerfile: Dockerfile

    container_name: ems-web

    restart: unless-stopped

    # No `ports:` -- reachable only on the compose network, by admin-portal
    # (EMS_WEB_UPSTREAM=http://ems-web:80). The browser only ever talks to the
    # admin-portal origin, which authenticates before proxying /app/*. No
    # env_file: this container holds no secrets and no credentials.

    # Static file server only: immutable root filesystem; nginx's cache, pid
    # and temp paths are in-memory.
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    security_opt:
      - no-new-privileges:true

    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:80/app/ || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 5s
