# ============================================================================
# WiseWatts EMS - Telegraf Configuration
#
# Phase:
#   MQTT ingestion foundation
#
# Responsibility:
#   MQTT broker -> raw telemetry capture
#
# Design principle:
#   Telegraf stores raw payloads.
#   Semantic interpretation happens later through metadata mappings.
#
# ============================================================================


[agent]


  debug = true
  logfile = ""

  # Collect frequently but do not create excessive overhead.
  interval = "10s"

  # Ensure timestamps are UTC internally.
  precision = "1s"

  # Buffer messages during database/network interruptions.
  metric_buffer_limit = 10000

  # Do not drop data silently.
  flush_interval = "10s"


###############################################################################
# MQTT INPUT
###############################################################################
[[inputs.mqtt_consumer]]

  name_override = "mqtt_staging"

  servers = [
    "ssl://${MQTT_HOST}:${MQTT_PORT}"
  ]

  topics = [
    # Consolidated gateway payload:
    # wwems/v1/{organization}/{site}/{gateway}/telemetry
    "wwems/v1/+/+/+/telemetry",

    # Individual device payload:
    # wwems/v1/{organization}/{site}/{gateway}/{device}/telemetry
    "wwems/v1/+/+/+/+/telemetry"
  ]

  qos = 1

  connection_timeout = "30s"

  username = "${MQTT_USERNAME}"
  password = "${MQTT_PASSWORD}"

  data_format = "value"
  data_type = "string"
###############################################################################
# POSTGRESQL OUTPUT
#
# Raw MQTT capture through an insert-only compatibility view.
#
# Measurement name remains mqtt_staging. PostgreSQL exposes it as an
# insert-only view that writes directly to telemetry.raw_messages.
#
# Data flow:
# MQTT JSON
#    |
#    v
# public.mqtt_staging (insert-only adapter view)
#    |
#    v
# telemetry.raw_messages
#    |
#    v
# telemetry.normalized_points and domain tables
###############################################################################

[[outputs.postgresql]]

  connection = "host=timescaledb user=${POSTGRES_USER} password=${POSTGRES_PASSWORD} dbname=${POSTGRES_DB} sslmode=disable"

  # Insert adapter schema. No telemetry is stored in public.
  schema = "public"

  # Preserve the absolute MQTT ingestion instant across database time zones.
  timestamp_column_name = "received_at"
  timestamp_column_type = "timestamp with time zone"

  # Store MQTT metadata as tags
  tags_as_jsonb = true

  # Store JSON payload fields without flattening
  fields_as_jsonb = true
