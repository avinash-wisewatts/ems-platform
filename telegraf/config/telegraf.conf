# ============================================================================
# WiseWatts EMS - Telegraf Configuration
#
# Phase:
#   MQTT ingestion foundation
#
# Responsibility:
#   MQTT broker -> raw telemetry capture
#
# Design principle:
#   Telegraf stores raw payloads.
#   Semantic interpretation happens later through metadata mappings.
#
# ============================================================================


[agent]


  debug = true
  logfile = ""

  # Collect frequently but do not create excessive overhead.
  interval = "10s"

  # Ensure timestamps are UTC internally.
  precision = "1s"

  # Buffer messages during database/network interruptions.
  metric_buffer_limit = 10000

  # Do not drop data silently.
  flush_interval = "10s"


###############################################################################
# MQTT INPUT -- Broker #1
#
# Simultaneous dual-broker fan-in: this platform consumes from two MQTT
# brokers at the same time. Each broker is a SEPARATE [[inputs.mqtt_consumer]]
# instance (Broker #1 below, Broker #2 further down). A single consumer with a
# multi-entry `servers` array is NOT used: Telegraf treats multiple `servers`
# entries as a failover list (one active connection), not concurrent fan-in.
#
# Both instances deliberately share name_override = "mqtt_staging" so both feed
# the SAME existing PostgreSQL output -> public.mqtt_staging view ->
# telemetry.capture_telegraf_mqtt_insert() trigger -> telemetry.raw_messages.
# Deduplication remains the existing (event_time, device_id, logical_point_id)
# identity in telemetry.normalized_points; device/tenant identity is resolved
# from the payload rtdata[].uid, independent of which broker delivered it.
###############################################################################
[[inputs.mqtt_consumer]]

  name_override = "mqtt_staging"

  servers = [
    "ssl://${MQTT_HOST}:${MQTT_PORT}"
  ]

  topics = [
    # Consolidated gateway payload:
    # wwems/v1/{organization}/{site}/{gateway}/telemetry
    "wwems/v1/+/+/+/telemetry",

    # Individual device payload:
    # wwems/v1/{organization}/{site}/{gateway}/{device}/telemetry
    "wwems/v1/+/+/+/+/telemetry"
  ]

  qos = 1

  connection_timeout = "30s"

  username = "${MQTT_USERNAME}"
  password = "${MQTT_PASSWORD}"

  data_format = "value"
  data_type = "string"

###############################################################################
# MQTT INPUT -- Broker #2
#
# Independent, simultaneous consumer for the second broker. Identical topic
# patterns, QoS and name_override to Broker #1 so its messages enter the exact
# same persisted-ingestion path. The `broker` tag is operational-diagnostics
# only: the capture trigger reads only tags->>'topic', so this tag never
# reaches telemetry.raw_messages and does not affect normalization, dedupe or
# the energy/environment semantic model. Broker #1 has no such tag, which is
# itself a sufficient distinguisher in Telegraf logs / metrics.
#
# Host/port are the shared MQTT2_HOST / MQTT2_PORT. Credentials are the
# DEDICATED Telegraf subscriber identity MQTT2_TELEGRAF_USERNAME /
# MQTT2_TELEGRAF_PASSWORD -- distinct from the live-telemetry subscriber's
# MQTT2_LIVE_* identity, mirroring Broker #1's per-path credential split.
# All come from the untracked per-host telegraf/.env (see
# telegraf/.env.example). If they are unset on a host, this instance simply
# fails to connect and logs it -- Broker #1 is unaffected.
###############################################################################
[[inputs.mqtt_consumer]]

  name_override = "mqtt_staging"

  servers = [
    "ssl://${MQTT2_HOST}:${MQTT2_PORT}"
  ]

  topics = [
    # Consolidated gateway payload:
    # wwems/v1/{organization}/{site}/{gateway}/telemetry
    "wwems/v1/+/+/+/telemetry",

    # Individual device payload:
    # wwems/v1/{organization}/{site}/{gateway}/{device}/telemetry
    "wwems/v1/+/+/+/+/telemetry"
  ]

  qos = 1

  connection_timeout = "30s"

  username = "${MQTT2_TELEGRAF_USERNAME}"
  password = "${MQTT2_TELEGRAF_PASSWORD}"

  data_format = "value"
  data_type = "string"

  [inputs.mqtt_consumer.tags]
    broker = "2"

###############################################################################
# POSTGRESQL OUTPUT
#
# Raw MQTT capture through an insert-only compatibility view.
#
# Measurement name remains mqtt_staging. PostgreSQL exposes it as an
# insert-only view that writes directly to telemetry.raw_messages.
#
# Data flow:
# MQTT JSON
#    |
#    v
# public.mqtt_staging (insert-only adapter view)
#    |
#    v
# telemetry.raw_messages
#    |
#    v
# telemetry.normalized_points and domain tables
###############################################################################

[[outputs.postgresql]]

  connection = "host=timescaledb user=${POSTGRES_USER} password=${POSTGRES_PASSWORD} dbname=${POSTGRES_DB} sslmode=disable"

  # Insert adapter schema. No telemetry is stored in public.
  schema = "public"

  # Preserve the absolute MQTT ingestion instant across database time zones.
  timestamp_column_name = "received_at"
  timestamp_column_type = "timestamp with time zone"

  # Store MQTT metadata as tags
  tags_as_jsonb = true

  # Store JSON payload fields without flattening
  fields_as_jsonb = true
