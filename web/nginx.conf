# Standalone serving of the EMS Web App -- the dedicated `ems-web` container
# (compose.yaml). Not published on a host port: the admin-portal proxies the
# authenticated /app/* URL space here (EMS_WEB_UPSTREAM, app/src/main.py).
# Same behaviour the admin-portal FastAPI /app hook provides when the bundle
# is extracted into it (the rollback fallback).
server {
  listen 80;
  server_name _;

  # Any redirect nginx itself issues stays relative (/app/...), never
  # http://ems-web/..., because the browser only ever sees the portal origin.
  absolute_redirect off;
  server_tokens off;

  # No indexing of an internal tool.
  add_header X-Robots-Tag "noindex, nofollow" always;

  # Hashed, content-addressed assets -- safe to cache immutably.
  location /app/assets/ {
    root /usr/share/nginx/html;
    access_log off;
    # One combined header (`expires` would add a second Cache-Control).
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Everything else under /app -> the SPA entry (client-side routing).
  location /app {
    root /usr/share/nginx/html;
    add_header Cache-Control "no-store";
    try_files $uri /app/index.html;
  }

  # This container serves ONLY the frontend. /api, /login, /logout are the
  # admin-portal's, which also enforces authentication before proxying /app
  # here. Nothing here proxies or terminates the session.
  location = / {
    return 302 /app/;
  }
}
