# Standalone serving of the Phase 8 shell (sidecar mode). Same behaviour the
# admin-portal FastAPI /app hook provides when the bundle is extracted into it.
server {
  listen 80;
  server_name _;

  # No indexing of an internal tool.
  add_header X-Robots-Tag "noindex, nofollow" always;

  # Hashed, content-addressed assets -- safe to cache immutably.
  location /app/assets/ {
    root /usr/share/nginx/html;
    access_log off;
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Everything else under /app -> the SPA entry (client-side routing).
  location /app {
    root /usr/share/nginx/html;
    add_header Cache-Control "no-store";
    try_files $uri /app/index.html;
  }

  # This container serves ONLY the frontend. /api, /login, /logout are the
  # admin-portal's; in sidecar mode a front proxy routes those. Nothing here
  # proxies or terminates the session.
  location = / {
    return 302 /app/;
  }
}
